name: Marketing site preview QA
on:
  push:
    branches:
      - feat/prompted-capability-dual-demo-direct-20261021
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-and-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tests and browser
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4 playwright
          python -m playwright install --with-deps chromium
      - name: Static prelaunch gate
        run: python tools/prelaunch_gate.py
      - name: FI/EN mobile and dual-path browser QA
        run: python tools/buyer_experience_qa.py
      - name: Save QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-qa-reports
          path: |
            tools/prelaunch_gate_results.json
            tools/buyer_experience_qa_results.json
          retention-days: 3
